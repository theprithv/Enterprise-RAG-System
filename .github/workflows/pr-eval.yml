name: PR Evaluation Gate

on:
  pull_request:
    branches: [ "main" ]

jobs:
  llmops-eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install LLMOps Dependencies
        run: |
          pip install mlflow pyyaml pandas langchain langchain-huggingface \
                      pymilvus sentence-transformers openai langfuse duckduckgo-search

      - name: Start MLflow Tracking Server
        run: |
          mlflow server --host 127.0.0.1 --port 5000 &
          sleep 5

      - name: Run MLflow Evaluation Suite
        env:
          # Judge connects directly to TL's vLLM server (Qwen3-14B)
          # No Ollama or LiteLLM proxy needed — server is already OpenAI-compatible
          OPENAI_BASE_URL: "http://88.198.23.47:31062/v1"
          OPENAI_API_KEY: ${{ secrets.TL_VLLM_API_KEY }}
          MILVUS_URI: ${{ secrets.MILVUS_URI }}
          VLLM_API_BASE: ${{ secrets.VLLM_API_BASE }}
          VLLM_API_KEY: ${{ secrets.VLLM_API_KEY }}
          VLLM_MODEL: ${{ secrets.VLLM_MODEL }}
        run: |
          python eval/run_eval.py

      - name: Check for Regressions against Baseline
        run: |
          python -c "
          import json, sys
          with open('baseline.json') as f: base = json.load(f)
          with open('new_baseline.json') as f: new = json.load(f)
          regressed = False
          for metric, base_val in base.items():
              if metric in new and new[metric] < base_val - 0.05:
                  print(f'❌ Regression in {metric}: {new[metric]:.4f} < baseline {base_val:.4f}')
                  regressed = True
              else:
                  print(f'✅ {metric}: {new.get(metric, \"N/A\")}')
          if regressed:
              sys.exit(1)
          print('All metrics met or exceeded the baseline!')
          "

      - name: Post Scorecard to PR Comment
        if: always()
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            let metrics = {};
            try { metrics = JSON.parse(fs.readFileSync('baseline.json', 'utf8')); } catch(e) {}
            let body = '### 📊 LLMOps Evaluation Scorecard\n\n| Metric | Score |\n|---|---|\n';
            for (const [key, value] of Object.entries(metrics)) {
              const score = typeof value === 'number' ? value.toFixed(4) : value;
              const icon = value >= 4.0 ? '🟢' : value >= 2.5 ? '🟡' : '🔴';
              body += `| ${key} | ${icon} ${score} |\n`;
            }
            body += '\n> Judge: Qwen3-14B on TL vLLM Server | Runner: GitHub Actions';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            })
