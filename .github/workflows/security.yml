name: DevSecOps Scans

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  security-scans:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks (Secret Scanner)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        
      - name: LLM Prompt Injection Security Gate
        run: |
          echo "Running MLflow injection eval cases..."
          # The injection check is natively handled in our pr-eval.yml!
          # If the 'is_injection_ignored' metric drops below 1.0, the build fails.
